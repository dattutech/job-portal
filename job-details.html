<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Details | JobLane</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="job-details">

<div id="site-header-slot"></div>

<div class="page-band" style="padding:32px 0;">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / <a href="jobs.html">Jobs</a> / Details</div>
  </div>
</div>

<section style="padding-top:24px;" id="job-details-root">
  <div class="container details-grid">

    <div class="details-card">
      <div class="details-header">
        <img id="dd-logo" src="" alt="">
        <div>
          <h1 id="dd-title"></h1>
          <span class="company-name" id="dd-company"></span>
          <div style="font-size:13px; color:var(--ink-soft); margin-top:6px;" id="dd-posted"></div>
        </div>
      </div>

      <div class="details-facts">
        <div class="fact"><span>Location</span><b id="dd-location"></b></div>
        <div class="fact"><span>Salary</span><b id="dd-salary"></b></div>
        <div class="fact"><span>Experience</span><b id="dd-experience"></b></div>
        <div class="fact"><span>Qualification</span><b id="dd-qualification"></b></div>
      </div>

      <h2 class="block-title">Job Description</h2>
      <p id="dd-description"></p>

      <h2 class="block-title">Responsibilities</h2>
      <ul class="tick-list" id="dd-responsibilities"></ul>

      <h2 class="block-title">Skills Required</h2>
      <div class="skill-tags" id="dd-skills"></div>

      <div style="margin-top:28px; display:flex; gap:10px; flex-wrap:wrap;">
        <a href="#" id="dd-apply" target="_blank" rel="noopener" class="btn btn-primary">Apply Now</a>
        <a href="jobs.html" class="btn btn-outline">← Back to Jobs</a>
      </div>
    </div>

    <aside class="apply-card">
      <div class="salary-big" id="dd-salary-big"></div>
      <div class="salary-label">Estimated compensation</div>
      <a href="#" id="dd-apply-sidebar" target="_blank" rel="noopener" class="btn btn-primary btn-block">Apply Now</a>
      <button class="btn btn-outline btn-block" id="share-copy" type="button">Copy Link</button>

      <div class="share-row">
        <a class="share-btn" id="share-whatsapp" href="#" target="_blank" rel="noopener" aria-label="Share on WhatsApp">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.6-.6-2.9-1.2-4.8-4.1-4.9-4.3-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5.2.5.7 1.8.8 1.9.1.2.1.3 0 .5-.1.2-.1.3-.3.5-.1.2-.3.4-.4.5-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.2 1.4 2.5 1.5.3.1.5.1.7-.1.2-.2.7-.8.9-1.1.2-.3.4-.2.6-.1.2.1 1.5.7 1.8.8.3.1.5.2.5.3.1.2.1.6-.1 1.3Z"/></svg>
        </a>
        <a class="share-btn" id="share-linkedin" href="#" target="_blank" rel="noopener" aria-label="Share on LinkedIn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3V9Zm7 0h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.7c0-1.36-.03-3.1-1.9-3.1-1.9 0-2.2 1.48-2.2 3v5.8h-4V9Z"/></svg>
        </a>
      </div>
    </aside>
  </div>
</section>

<section>
  <div class="container">
    <div class="section-head reveal">
      <div>
        <span class="eyebrow">Keep exploring</span>
        <h2>Related Jobs</h2>
      </div>
      <a href="jobs.html" class="link-more">View all jobs →</a>
    </div>
    <div class="job-grid" id="related-jobs-grid"></div>
  </div>
</section>

<div id="site-footer-slot"></div>

<script src="js/jobs-fallback.js"></script>
<script src="js/partials.js"></script>
<script src="js/jobs.js"></script>
<script src="js/search.js"></script>
<script src="js/script.js"></script>
</body>
</html>
